
name: SonarQube Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # JOB 1: UNIT TESTING
  unit_testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run unit tests and generate coverage
      - name: Run unit tests
        run: npm test -- --coverage

      # Step 5: Verify coverage report
      - name: Verify coverage report
        run: |
          echo "Checking coverage directory..."
          ls -lah coverage/
          echo "Checking LCOV file..."
          test -f coverage/lcov.info

      # Step 6: Upload coverage artifact
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          retention-days: 5
          if-no-files-found: error

  # JOB 2: SONARQUBE ANALYSIS
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: unit_testing

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Download coverage artifact
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: coverage

      # Step 5: Verify downloaded coverage
      - name: Verify downloaded coverage
        run: |
          echo "Checking downloaded coverage..."
          ls -lah coverage/
          echo "Checking LCOV file..."
          test -f coverage/lcov.info
          head -20 coverage/lcov.info

      # Step 6: Check Java version
      - name: Check Java version
        run: java -version

      # Step 7: SonarQube analysis
      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=SonarQube-demo-project
            -Dsonar.projectName=SonarQube-demo-project
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.test.inclusions=tests/**/*.test.js
            -Dsonar.exclusions=node_modules/**,coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      # Step 8: SonarQube Quality Gate
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}